# Free Supabase projects pause after 7 days without activity. A query every
# few days keeps the backend up for anyone installing the APK.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database
        run: |
          set -a && . ./.env && set +a
          curl --fail --silent --show-error \
            "$EXPO_PUBLIC_SUPABASE_URL/rest/v1/comments?select=id&limit=1" \
            -H "apikey: $EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
